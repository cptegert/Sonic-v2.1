; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; ONE firmware for all robots. Which robot a board is (name, Bluetooth name,
; RemoteXY GUI, motor scale) is stored on the board itself, see src/robot_config.h.
;
;   Upload (detects the robot, sets the identity if needed):
;     ~/.platformio/penv/bin/python tools/robot.py upload
;     ~/.platformio/penv/bin/python tools/robot.py upload --robot knuckles   (new board)
;   Plain PlatformIO upload works too (VS Code Upload button): the board keeps the
;   identity it has; a new board starts as "Robot-xxxx" -> serial/Wi-Fi: name <robot>
;
; A used ESP32 with an old file system crashes the logger at startup: erase it
; once before the first upload:  tools/robot.py upload --robot <r> --erase

[platformio]
default_envs = robot

[env:robot]
; Versions pinned (2026-11-21) so every PC builds the same firmware. The code needs
; the ESP32 Arduino core 3.x (comes with platform espressif32 8.0.0); older
; platforms fail with missing Wi-Fi / network headers.
platform = platformio/espressif32 @ 8.0.0
board = upesy_wroom
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps = 
	pololu/VL53L1X @ 1.3.1
	remotexy/RemoteXY @ 4.1.11
	madhephaestus/ESP32Servo @ 3.2.1
	adafruit/Adafruit NeoPixel @ 1.15.5
