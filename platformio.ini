; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; One code base, one environment per robot. They differ only in ROBOT_NAME
; (Bluetooth name for the RemoteXY app, Wi-Fi "<name>-log", name in the log).
; Everything else stored on the robot itself (PID values, battery on/off and
; calibration) is per robot anyway.
;
;   Upload to Sonic:   pio run -e sonic  -t upload
;   Upload to Shadow:  pio run -e shadow -t upload
;   (VS Code: pick the environment in the PlatformIO status bar first)
;
; A used ESP32 with an old file system crashes the logger at startup: erase it
; once before the first upload:  pio run -e <robot> -t erase

[platformio]
default_envs = sonic

[env]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps = 
	pololu/VL53L1X@^1.3.1
	remotexy/RemoteXY@^4.1.8
	madhephaestus/ESP32Servo@^3.0.9
	adafruit/Adafruit NeoPixel@^1.15.2

[env:sonic]
build_flags = -D ROBOT_NAME=\"Sonic-X\"

[env:shadow]
; own RemoteXY GUI (src/RemoteXY_GUI_Shadow.h) and Bluetooth name
build_flags = -D ROBOT_NAME=\"Shadow\" -D ROBOT_SHADOW -D ROBOT_BLE_NAME=\"Shadow_v2_Bluetooth_v4\"
